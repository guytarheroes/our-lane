name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ยิงคู่กับ check ไม่ต้องรอใคร — ให้ Discord รู้ตั้งแต่ตอนเริ่ม ไม่ใช่รู้ตอนจบอย่างเดียว
  notify-start:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: แจ้ง Discord ว่าเริ่มแล้ว
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: Build started!
          COLOR: 3447003
          NODE: GitHub-hosted
          STAGE: check
          VERB: started
          PROJECT: ${{ github.repository }}/${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DESC=$(printf 'A Build **#%s** at **%s** process has %s!\n%s' \
            "$RUN_NUMBER" "$STAGE" "$VERB" \
            "$(printf '%s' "${MESSAGE:-(ไม่มีข้อความ commit)}" | head -1)")
          BRANCH="[origin/main]($REPO_URL/tree/main)"
          COMMIT="[$SHA]($REPO_URL/commit/$SHA)"
          export DESC BRANCH COMMIT
          sh .github/discord.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # runner เป็น amd64 คนละ arch กับ Pi — step นี้มีไว้จับ Dockerfile พังเท่านั้น ไม่ push ไปไหน
      - run: docker build -t our-lane:ci .

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # runner ติดตั้งบน Pi เอง เพราะ Pi ไม่มี public IP และไม่เปิด port ให้ SSH เข้า
    # ได้ arm64 + network server_default + docker daemon ครบในตัว
    runs-on: self-hosted
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # -p our-lane ตรึงชื่อ compose project — ถ้าไม่ตรึง compose จะตั้งชื่อตามชื่อโฟลเดอร์
      # ย้ายโฟลเดอร์เมื่อไหร่ได้ volume ใหม่ = ความทรงจำหายทั้งหมด
      - name: docker compose up
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          START_DATE: ${{ vars.START_DATE }}
          COUPLE_NAME: ${{ vars.COUPLE_NAME }}
        run: docker compose -p our-lane up -d --build

      - name: smoke check
        run: |
          for i in $(seq 1 15); do
            if docker compose -p our-lane exec -T web \
              node -e "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            then
              echo "up"
              exit 0
            fi
            sleep 2
          done
          docker compose -p our-lane logs --tail 60 web
          exit 1

      - name: prune old images
        if: always()
        run: docker image prune -f

  notify:
    needs: [check, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ส่ง context ผ่าน env: ไม่แปะ ${{ }} ลงใน run: ตรง ๆ — commit message เป็น input ที่ผู้อื่นแก้ได้
      # ตัวที่กันจริงคือ jq --arg ใน .github/discord.sh
      - name: แจ้ง Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CHECK: ${{ needs.check.result }}
          DEPLOY: ${{ needs.deploy.result }}
          NODE: Raspberry Pi (self-hosted)
          PROJECT: ${{ github.repository }}/${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE: https://bibistang.guytarheroes.com
        run: |
          if [ "$DEPLOY" = "success" ]; then
            TITLE="Build successful!"; COLOR=3066993; STAGE=deploy; VERB=successful
          elif [ "$CHECK" != "success" ]; then
            TITLE="Build failed!"; COLOR=15158332; STAGE=check; VERB=failed
          elif [ "$DEPLOY" = "cancelled" ]; then
            # cancelled = concurrency group เตะทิ้งเพราะมี commit ใหม่กว่าต่อคิว ไม่ใช่ของพัง
            # ถ้าเห็นอันนี้รัวทุก commit แปลว่า runner บน Pi ไม่รับงาน
            TITLE="Build skipped!"; COLOR=9807270; STAGE=deploy; VERB=skipped
          else
            TITLE="Deploy failed!"; COLOR=15158332; STAGE=deploy; VERB=failed
          fi

          DESC=$(printf 'A Build **#%s** at **%s** process has %s!\n%s' \
            "$RUN_NUMBER" "$STAGE" "$VERB" \
            "$(printf '%s' "${MESSAGE:-(ไม่มีข้อความ commit)}" | head -1)")
          if [ "$DEPLOY" = "success" ]; then DESC=$(printf '%s\n%s' "$DESC" "$SITE"); fi
          BRANCH="[origin/main]($REPO_URL/tree/main)"
          COMMIT="[$SHA]($REPO_URL/commit/$SHA)"
          export TITLE COLOR DESC BRANCH COMMIT
          sh .github/discord.sh
